name: 'Code Health - Dev Herald'
description: 'Send CI health data to Dev Herald to power codebase health reports'
branding:
  icon: 'activity'
  color: 'green'

inputs:
  api-key:
    description: 'Dev Herald project API key'
    required: true

  knip-report-path:
    description: 'Path to a Knip JSON report file. Omit to skip unused-code signals.'
    required: false
    default: ''

  cve:
    description: 'If true, scan a lockfile for CVEs. With no lockfile-path, auto-detects pnpm-lock.yaml, yarn.lock, package-lock.json, or bun.lock (OSV uses npm and pnpm only). Default false, so an initiatives-only run does not create a health report.'
    required: false
    default: 'false'

  lockfile-path:
    description: 'Path to a lockfile to scan for CVEs. Setting this opts into the scan. CVE/OSV uses npm and pnpm only; yarn or bun emits a warning and skips CVE. Omit unless cve is true (then the action auto-detects a lockfile).'
    required: false
    default: ''

  cve-detail:
    description: 'If true, fetch per-vulnerability details from OSV for per-issue severity and descriptions plus aggregate severity buckets (slower). If false, still sends vulnerable package names and OSV ids, without severities or descriptions.'
    required: false
    default: 'false'

  api-url:
    description: 'Dev Herald ingest API endpoint'
    required: false
    default: 'https://dev-herald.com/api/v1/health/ingest'

  repository-full-name:
    description: 'owner/repo (defaults to GitHub context)'
    required: false

  commit-sha:
    description: 'Commit SHA (defaults to GitHub context)'
    required: false

  workflow-run-url:
    description: 'Link to the workflow run'
    required: false

  bundle-stats-path:
    description: 'Path to bundle analysis output (file or directory). Supported today: Next.js experimental-analyze --output dir, Turbopack route-bundle-stats.json, @next/bundle-analyzer dir (e.g. .next/analyze with client.json) or a single webpack-bundle-analyzer JSON file. Plain Webpack and Vite artifacts will use the same input as parsers are added.'
    required: false
    default: ''

  initiatives:
    description: 'YAML or JSON map of initiative slug to metric counts. Copy each slug and metric key from the initiative in the dashboard. Keys differ per initiative. Example: `emotion-to-panda: { files: 12, usages: 96 }` and `drop-ts-ignore: { directives: 40 }` in the same map. Omit to skip measurements. Set this or initiatives-path, not both.'
    required: false
    default: ''

  initiatives-path:
    description: 'Path to a JSON or YAML file with the same map as initiatives (slug to metric key to count). Relative paths are from the workspace root. Set this or initiatives, not both.'
    required: false
    default: ''

outputs:
  report-id:
    description: 'Health report ID'

  status:
    description: 'created when a health report was created, measured when the run only sent initiative counts, or failed'

runs:
  using: 'node20'
  main: 'dist/index.js'
